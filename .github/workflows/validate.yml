name: Validate application

on:
  pull_request:
  push:
    branches: [develop, 'codex/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Lint modernization modules
        run: npx eslint src scripts/update-game-data.mjs tests --max-warnings 0
      - run: npm run build

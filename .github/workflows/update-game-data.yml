name: Update Tarkov game data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarkov-data-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore API bodies and HTTP validators
        uses: actions/cache/restore@v4
        with:
          path: .cache/tarkov-api
          key: ${{ runner.os }}-tarkov-api-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-tarkov-api-v1-
      - name: Fetch and validate all modes
        id: update
        run: npm run data:update
      - name: Save refreshed API cache
        uses: actions/cache/save@v4
        with:
          path: .cache/tarkov-api
          key: ${{ runner.os }}-tarkov-api-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate application with candidate snapshots
        run: |
          npm run lint -- --max-warnings 0
          npm run typecheck
          npm run build
      - name: Propose only semantic changes
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/game-data
          if git diff --cached --quiet; then
            echo 'No semantic changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          revision=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; const {modes}=JSON.parse(readFileSync("public/game-data/manifest.json", "utf8")); console.log(createHash("sha256").update(JSON.stringify(Object.entries(modes).sort().map(([mode, entry]) => [mode, entry.revision]))).digest("hex"));')
          branch="codex/tarkov-data-${revision}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): update validated Tarkov snapshots'
          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -z "$remote_branch" ]; then
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr=$(gh pr list --base main --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [ -z "$pr" ]; then
            printf '%s\n' \
              'Automated game-data update. All three modes were fetched and validated.' \
              '' \
              'Validation: tests, lint, typecheck, and production build passed before this PR was created.' \
              'Merge this PR to publish through the normal main deployment. No branch protections are bypassed.' > "$RUNNER_TEMP/tarkov-data-pr.md"
            pr=$(gh pr create --base main --head "$branch" \
              --title 'chore(data): update validated Tarkov snapshots' \
              --body-file "$RUNNER_TEMP/tarkov-data-pr.md")
          fi
          echo "Validated data update: $pr" >> "$GITHUB_STEP_SUMMARY"

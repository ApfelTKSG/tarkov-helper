name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      data-only:
        description: Publish only when game data changed
        type: boolean
        default: false

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      cache-base: ${{ steps.baseline.outputs.cache-base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Identify repository data baseline
        id: baseline
        env:
          BASELINE: ${{ hashFiles('public/game-data/manifest.json') }}
        run: echo "cache-base=${RUNNER_OS}-published-data-v1-${BASELINE}-" >> "$GITHUB_OUTPUT"
      - name: Restore last successfully published snapshots
        uses: actions/cache/restore@v4
        with:
          path: public/game-data
          key: ${{ steps.baseline.outputs.cache-base }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.baseline.outputs.cache-base }}
      - name: Restore API bodies and validators
        uses: actions/cache/restore@v4
        with:
          path: .cache/tarkov-api
          key: ${{ runner.os }}-tarkov-api-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-tarkov-api-v1-
      - name: Fetch and validate all modes
        id: update
        run: npm run data:update
      - name: Save verified API cache
        uses: actions/cache/save@v4
        with:
          path: .cache/tarkov-api
          key: ${{ runner.os }}-tarkov-api-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate application and build
        run: |
          node --experimental-strip-types scripts/validate-game-data.mjs
          npm test
          npm run lint -- --max-warnings 0
          npm run typecheck
          npm run build
      - name: Publish code changes or semantic data changes
        id: decision
        env:
          PUBLISH: ${{ !inputs.data-only || steps.update.outputs.changed == 'true' }}
        run: |
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != true ]; then
            echo 'No semantic data changes; current site retained.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload website
        if: steps.decision.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Preserve candidate snapshots for successful deployment
        if: steps.decision.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: published-game-data
          path: public/game-data
          retention-days: 7

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Download successfully published snapshots
        uses: actions/download-artifact@v4
        with:
          name: published-game-data
          path: public/game-data
      - name: Cache only successfully published snapshots
        uses: actions/cache/save@v4
        with:
          path: public/game-data
          key: ${{ needs.build.outputs.cache-base }}${{ github.run_id }}-${{ github.run_attempt }}
